# Creado por Aldo Garcia.
# ---------------------------------------------------------------------------
# Reverse proxy de Matrix RH.
#
# Único servicio expuesto. MySQL, Qdrant y Ollama permanecen en la red interna.
# Las cabeceras de seguridad se aplican TAMBIÉN aquí, aunque el backend ya las
# emite: si un día se sirve contenido estático desde el propio proxy, seguirá
# protegido.
# ---------------------------------------------------------------------------

# Redirección a HTTPS.
server {
    listen 80;
    server_name _;

    # El health check del orquestador puede seguir usando HTTP interno.
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Sustituir por certificados reales. Nunca versionar las claves privadas.
    ssl_certificate     /etc/nginx/certs/matrixrh.crt;
    ssl_certificate_key /etc/nginx/certs/matrixrh.key;

    # TLS 1.2 como mínimo; se prefiere 1.3.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MatrixRH:10m;
    ssl_session_timeout 1h;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # No revelar la versión de Nginx.
    server_tokens off;

    # Cabeceras de seguridad.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Tamaño máximo de carga: debe ser coherente con UPLOAD_MAX_BYTES.
    client_max_body_size 30m;
    client_body_timeout  120s;

    location / {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los turnos analiticos de Gemma pueden tardar varios minutos si el
        # contexto no cabe entero en la GPU. Sin estos timeouts, el proxy cortaria
        # la respuesta y el usuario vería un 504 espurio.
        proxy_connect_timeout 30s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        proxy_buffering off;
    }
}
