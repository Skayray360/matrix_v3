# Creado por Aldo Garcia. Solo datos sinteticos, sin secretos corporativos.
name: implementation-v2
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrixrh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}/backend
      SCHEDULER_ENABLED: 'false'
      MATRIX_SEED_PASSWORD: Matrix RH # secrets-scan: allow (fixture local sintetico)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.33'
      - name: Install locked backend
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Backend lint and types
        working-directory: backend
        run: |
          uv run --frozen ruff check app scripts seeds tests
          uv run --frozen mypy app
      - name: Verify frontend lock before download
        run: backend/.venv/bin/python -m scripts.verify_supply_chain --lock-only
      - name: Audit all frontend dependencies before download
        working-directory: frontend
        run: npm audit --audit-level=low --include=dev --include=optional --include=peer
      - name: Install locked frontend without lifecycle scripts
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund --include=dev --include=optional --include=peer
      - name: Verify installed frontend before executing build tools
        run: backend/.venv/bin/python -m scripts.verify_supply_chain
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm test
      - name: Unit and security contracts
        run: backend/.venv/bin/python -m pytest backend/tests/unit backend/tests/security --tb=short
  windows-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Back up and retire legacy BAT on native Windows
        shell: python
        run: |
          import os
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path('backend').absolute()))
          from scripts.clean_legacy_layout import LEGACY_LAUNCHERS, clean
          with tempfile.TemporaryDirectory(prefix='Matrix cleanup with spaces ') as folder:
              root = Path(folder)
              originals = {name: b'@echo off\r\nrem synthetic old launcher\r\n' for name in LEGACY_LAUNCHERS}
              for name, content in originals.items():
                  source = root / name
                  source.write_bytes(content)
                  # Distinguish creation/change timestamps without a sleep.
                  os.utime(source, (1_700_000_000, 1_700_000_000))
              (root / '.env').write_bytes(b'SYNTHETIC=preserved\n')
              (root / 'var/qdrant').mkdir(parents=True)
              (root / 'var/qdrant/state').write_bytes(b'synthetic state')
              result = clean(root)
              assert result['retired'] == len(originals), result
              for name, content in originals.items():
                  assert not (root / name).exists()
                  assert (root / result['backup'] / (name + '.retired')).read_bytes() == content
              assert (root / '.env').read_bytes() == b'SYNTHETIC=preserved\n'
              assert (root / 'var/qdrant/state').read_bytes() == b'synthetic state'
              assert clean(root)['retired'] == 0
          print('Windows cleanup: backup, retirement, preservation and repeat passed')
      - name: Parse PowerShell and exercise portable batch entry
        shell: powershell
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          . ./windows/Common-MatrixRH.ps1
          $owned = [pscustomobject]@{ ExecutablePath = (Join-Path (Get-MatrixRoot) '.venv\Scripts\python.exe'); CommandLine = 'python -m scripts.bootstrap serve' }
          if (-not (Test-MatrixOwnedProcess $owned)) { throw 'No identifica el proceso propio' }
          $owned.ExecutablePath = 'C:\otra-app\python.exe'
          if (Test-MatrixOwnedProcess $owned) { throw 'Acepta un PID ajeno' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'Matrix contract with spaces'
          New-Item -ItemType Directory -Force $testRoot | Out-Null
          Copy-Item INSTALAR_MATRIX_RH.bat $testRoot
          New-Item -ItemType Directory -Force (Join-Path $testRoot 'windows') | Out-Null
          # Stub del delegado: prueba forwarding y codigo de salida, no servicios.
          Set-Content (Join-Path $testRoot 'windows/Install-MatrixRH.ps1') 'param([switch]$Offline)', 'if (-not $Offline) { exit 23 }', 'exit 17' -Encoding ASCII
          & cmd.exe /d /c "call `"$testRoot\INSTALAR_MATRIX_RH.bat`" -Offline < NUL"
          if ($LASTEXITCODE -ne 17) { throw 'La entrada batch no propago argumentos/codigo' }
          exit 0
  mysql-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql:8.4
            health_command: mysqladmin ping -ptest
          - database: mariadb:10.11
            health_command: mariadb-admin ping -ptest
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: matrix_rh_test
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: matrix_rh_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health_command }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: mysql+pymysql://root:test@127.0.0.1:3306/matrix_rh_test # secrets-scan: allow (fixture MySQL efimero sin datos reales)
      MATRIX_SEED_PASSWORD: Matrix RH # secrets-scan: allow (fixture local sintetico)
      MATRIX_ADOPT_EXISTING_DATABASE: 'true'
      SCHEDULER_ENABLED: 'false'
      MATRIX_TEST_ALLOW_DESTRUCTIVE: 'true'
      QDRANT_PATH: ./var/tests/qdrant
      UPLOAD_STORAGE_ROOT: ./var/tests/uploads
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.33'
      - name: Install and migrate isolated synthetic database
        working-directory: backend
        run: |
          uv sync --frozen --extra dev
          uv run --frozen python -m scripts.bootstrap migrate
          uv run --frozen python -m scripts.bootstrap seed
      - name: Complete integration suite with disposable SQL
        run: backend/.venv/bin/python -m pytest backend/tests --tb=short -ra
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Build locked frontend and install browser
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --include=dev --include=optional --include=peer
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Browser integration with actual API and synthetic SQL
        env:
          MATRIX_E2E_BASE_URL: http://127.0.0.1:8000
          AUTH_PROVIDER: local_test
          LOCAL_TEST_AUTH_ENABLED: 'true'
          LOCAL_TEST_SEED_USERS_ENABLED: 'true'
          SESSION_COOKIE_SECURE: 'false'
        run: |
          MATRIX_CI_BACKEND_PID=''
          trap 'if [ -n "$MATRIX_CI_BACKEND_PID" ]; then kill "$MATRIX_CI_BACKEND_PID" 2>/dev/null || true; fi' EXIT
          MATRIX_CI_CASES=(
            'E2E-21 login Matrix funciona'
            'E2E-22 login MatrixR1 funciona'
            'E2E-02/33'
            'E2E-20 logout'
            'peticiones mutantes'
            'cookie de sesion'
            'E2E-15/16'
            'cabeceras de seguridad'
            'viewport movil'
          )
          for MATRIX_CI_CASE in "${MATRIX_CI_CASES[@]}"; do
            cd "$GITHUB_WORKSPACE/backend"
            .venv/bin/python -m scripts.bootstrap serve --skip-preflight > ../backend-ci.log 2>&1 &
            MATRIX_CI_BACKEND_PID=$!
            cd "$GITHUB_WORKSPACE/frontend"
            node -e 'let remaining=60; const probe=async()=>{try{const r=await fetch("http://127.0.0.1:8000/health");if(r.ok)return;}catch{}if(--remaining===0)process.exit(1);setTimeout(probe,1000);};probe();'
            npm run e2e -- --grep "$MATRIX_CI_CASE"
            kill "$MATRIX_CI_BACKEND_PID"
            wait "$MATRIX_CI_BACKEND_PID" || true
            MATRIX_CI_BACKEND_PID=''
          done
