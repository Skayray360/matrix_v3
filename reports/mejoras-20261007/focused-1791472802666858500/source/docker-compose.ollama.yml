# Creado por Aldo Garcia.
# Overlay de inferencia interno para Docker + NVIDIA; ejecucion predeterminada.
# Uso y provisionamiento offline: docs/README.md.

services:
  backend:
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_LOCAL_ONLY: "true"
      LLM_LOCAL_HOSTS: ${LLM_LOCAL_HOSTS:-127.0.0.1,localhost,::1},ollama
    networks: [matrixrh, matrix_proxy, matrix_llm]

  ollama:
    # TI debe proporcionar una imagen aprobada por digest, nunca latest.
    image: ${OLLAMA_IMAGE:?defina OLLAMA_IMAGE con repositorio@sha256 aprobado}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      # Estos limites son del runtime y no representan usuarios conectados.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-2}
    # Limita RAM del proceso, no VRAM. Dimensionar con pesos + contexto medidos.
    mem_limit: ${OLLAMA_MEMORY_LIMIT:?defina OLLAMA_MEMORY_LIMIT segun la RAM validada}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    volumes:
      - ollama_data:/root/.ollama
    # Sin puertos publicados, credenciales de BD, KB ni red de MySQL/Qdrant.
    networks: [matrix_llm]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${OLLAMA_GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  matrix_llm:
    driver: bridge
    internal: true

volumes:
  ollama_data:
