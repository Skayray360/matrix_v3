<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <!-- Creado por Aldo Garcia. -->
  <title id="title">Matrix RH 1.3.1: estructura real del proyecto</title>
  <desc id="desc">Jerarquía de carpetas y responsabilidades de React, FastAPI, MySQL, Qdrant y Ollama. La autorización se aplica en el backend antes de recuperar evidencia. Los modelos y los datos de ejecución se mantienen fuera del ZIP.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif} .title{font-size:42px;font-weight:800;fill:#10263f}
      .sub{font-size:19px;fill:#52647a}.mono{font-family:Consolas,'Liberation Mono',monospace;font-size:19px;fill:#dce6f5}
      .folder{font-family:Consolas,'Liberation Mono',monospace;font-size:20px;font-weight:700}
      .cardtitle{font-size:23px;font-weight:700}.body{font-size:18px;fill:#35475b}.small{font-size:16px;fill:#64748b}
      .wire{fill:none;stroke:#4b5b70;stroke-width:2}.card{fill:white;stroke:#dce3ed;stroke-width:1.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#63758c"/></marker>
  </defs>
  <rect width="1440" height="1120" fill="#f4f7fb"/>
  <rect x="40" y="38" width="7" height="78" rx="3" fill="#2374df"/>
  <text x="66" y="72" class="title">MATRIX RH</text>
  <text x="341" y="72" font-size="28" font-weight="700" fill="#60748b">ESTRUCTURA DEL PROYECTO</text>
  <text x="66" y="108" class="sub">React + FastAPI + MySQL + Qdrant + Ollama · Versión 1.3.1</text>

  <rect x="40" y="148" width="602" height="828" rx="20" fill="#101d2e"/>
  <text x="66" y="188" class="folder" fill="#ffffff">matrix-rh-1.3.0/</text>
  <path class="wire" d="M80 205V912 M80 228H105 M80 433H105 M80 682H105 M80 730H105 M80 778H105 M80 826H105 M80 870H105 M80 910H105"/>
  <text x="114" y="234" class="folder" fill="#6eb8ff">frontend/</text>
  <path class="wire" d="M128 247V393 M128 270H150 M158 282V364 M158 308H179 M158 336H179 M158 364H179 M128 393H150"/>
  <text x="160" y="275" class="mono">src/</text>
  <text x="188" y="313" class="mono">components/ · pages/</text>
  <text x="188" y="341" class="mono">services/ · security/ · assets/</text>
  <text x="188" y="369" class="mono">App.tsx · main.tsx · styles.css</text>
  <text x="160" y="399" class="mono">dist/ · package-lock.json</text>

  <text x="114" y="440" class="folder" fill="#6ee1b0">backend/</text>
  <path class="wire" d="M128 454V642 M128 475H150 M158 488V580 M158 502H178 M158 531H178 M158 560H178 M158 589H178 M128 619H150 M128 648H150"/>
  <text x="160" y="480" class="mono">app/</text>
  <text x="188" y="507" class="mono">api/ · auth/ · authorization/</text>
  <text x="188" y="536" class="mono">agents/ · llm/ · rag/</text>
  <text x="188" y="565" class="mono">ingestion/ · structured_data/</text>
  <text x="188" y="594" class="mono">database/ · memory/ · audit/</text>
  <text x="160" y="624" class="mono">migrations/ · seeds/ · tests/</text>
  <text x="160" y="653" class="mono">scripts/ · pyproject.toml · uv.lock</text>

  <text x="114" y="689" class="folder" fill="#c3b3ff">config/ · data/</text>
  <text x="114" y="716" font-size="15" fill="#98a9bf">Permisos, modelos y corpus autorizado</text>
  <text x="114" y="738" class="folder" fill="#ffd68b">windows/ · scripts/</text>
  <text x="114" y="765" font-size="15" fill="#98a9bf">Instalación, actualización y operación</text>
  <text x="114" y="787" class="folder" fill="#c3b3ff">infrastructure/</text>
  <text x="114" y="814" font-size="15" fill="#98a9bf">SQL, proxy y despliegue opcional</text>
  <text x="114" y="835" class="folder" fill="#ffd68b">docs/ · reports/</text>
  <text x="114" y="878" class="mono">.env.example · README.md</text>
  <text x="114" y="918" class="mono">SHA256SUMS.txt</text>
  <text x="66" y="953" font-size="14" fill="#98a9bf">Vista de carpetas principales; no sustituye el inventario de archivos.</text>

  <rect class="card" x="670" y="148" width="730" height="168" rx="18"/>
  <rect x="670" y="148" width="7" height="168" rx="3" fill="#2374df"/>
  <text x="698" y="185" class="cardtitle" fill="#1d64ba">FRONTEND · React / TypeScript / Vite</text>
  <text x="698" y="221" class="body">components/ y pages/ · interfaz del chat y sus pantallas</text>
  <text x="698" y="251" class="body">services/ · llamadas API; security/ · presentación segura</text>
  <text x="698" y="282" class="small">dist/ viene compilado: Node.js no es necesario para uso normal.</text>

  <rect class="card" x="670" y="334" width="730" height="205" rx="18"/>
  <rect x="670" y="334" width="7" height="205" rx="3" fill="#199b6b"/>
  <text x="698" y="371" class="cardtitle" fill="#167e59">BACKEND · Python 3.12 / FastAPI</text>
  <text x="698" y="407" class="body">api/ · endpoints; auth/ y authorization/ · identidad y alcance</text>
  <text x="698" y="437" class="body">agents/ · coordinación; llm/ · perfiles y adaptadores</text>
  <text x="698" y="467" class="body">ingestion/ y rag/ · extracción, recuperación y citas</text>
  <text x="698" y="503" class="small">La autorización se comprueba antes de recuperar evidencia.</text>

  <rect class="card" x="670" y="557" width="730" height="174" rx="18"/>
  <rect x="670" y="557" width="7" height="174" rx="3" fill="#8961c6"/>
  <text x="698" y="594" class="cardtitle" fill="#7751b5">DATOS · MySQL + Qdrant</text>
  <text x="698" y="630" class="body">MySQL · cuentas, conversaciones, cola y metadatos</text>
  <text x="698" y="660" class="body">Qdrant · vectores; data/knowledge/ · corpus corporativo</text>
  <text x="698" y="696" class="small">migrations/ versiona el esquema. var/ se crea en el equipo destino.</text>

  <rect class="card" x="670" y="749" width="730" height="169" rx="18"/>
  <rect x="670" y="749" width="7" height="169" rx="3" fill="#c98b23"/>
  <text x="698" y="786" class="cardtitle" fill="#a96b0d">IA LOCAL · Ollama</text>
  <text x="698" y="822" class="body">gemma4:latest · generación, análisis y resúmenes</text>
  <text x="698" y="852" class="body">embeddinggemma:latest · representaciones vectoriales</text>
  <text x="698" y="886" class="small">FAST y DEEP usan el mismo modelo, con distinto límite de salida.</text>
  <text x="686" y="949" class="small">Perfil predeterminado: localhost · Qdrant embebido · una API</text>
  <text x="686" y="974" class="small">La capacidad real requiere medir el hardware y los pesos instalados.</text>

  <rect x="40" y="1003" width="1360" height="83" rx="16" fill="#e8eef7"/>
  <text x="65" y="1034" font-size="15" font-weight="700" fill="#465c75">FLUJO</text>
  <text x="65" y="1058" font-size="14" fill="#63758c">de consulta</text>
  <g font-size="17" font-weight="700" fill="#253e5a">
    <rect x="184" y="1024" width="158" height="40" rx="8" fill="white"/><text x="227" y="1050">Usuario</text>
    <rect x="389" y="1024" width="182" height="40" rx="8" fill="white"/><text x="434" y="1050">Interfaz</text>
    <rect x="618" y="1024" width="311" height="40" rx="8" fill="white"/><text x="646" y="1050">API + identidad + permisos</text>
    <rect x="976" y="1024" width="395" height="40" rx="8" fill="white"/><text x="1003" y="1050">Evidencia autorizada + IA local</text>
  </g>
  <g stroke="#63758c" stroke-width="2" marker-end="url(#arrow)">
    <path d="M346 1044H380"/><path d="M575 1044H609"/><path d="M933 1044H967"/>
  </g>
</svg>
