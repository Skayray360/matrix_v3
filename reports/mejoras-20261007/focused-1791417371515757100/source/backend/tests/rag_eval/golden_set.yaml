# Creado por Aldo Garcia.
# Golden set de evaluacion del RAG (corpus 100% sintetico).
#
# Tipos de caso:
#   grounded    -> debe recuperar la categoria esperada y responder con cita.
#   denied      -> el usuario NO tiene acceso: no debe recuperar esa categoria
#                  ni filtrar titulos, cifras o conteos.
#   unsupported -> el corpus no contiene la respuesta: debe declarar insuficiencia.
#
# `expected_category` es la categoria de la que DEBE provenir la evidencia.
# `forbidden_categories` son categorias que jamas deben aparecer en la evidencia.

# expected_source_ids: conjunto completo de fuentes necesarias, no alternativas.
# En comparativas deben recuperarse AMBAS fuentes. Los IDs corresponden al
# extractor/chunker real con este perfil. Cambiarlo exige revisar las anotaciones;
# no se regeneran desde los resultados del recuperador ni del modelo.
# expected_source_quotes: hechos literales revisados en los Markdown sinteticos;
# comprueban la anotacion offline, NO son una evaluacion semantica de respuestas.
version: 2
source_profile:
  chunk_size_tokens: 900
  overlap_tokens: 120

cases:
  # ----------------------------------------------------- prestaciones (ambos)
  - id: prest-01
    user: Matrix
    type: grounded
    question: "Cuantos dias de vacaciones corresponden a 5 anios de antiguedad?"
