# Creado por Aldo Garcia.
# Definicion del paquete backend de Matrix RH y de sus dependencias.
# Se fija Python 3.12 porque toda la plataforma se valida contra esa version.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-rh-backend"
version = "1.4.2"
description = "Plataforma agentica de Recursos Humanos Matrix RH (backend)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Aldo Garcia" }]

dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography>=50,<51",
    "httpx==0.28.1",
    # Validacion de id_token de Microsoft Entra ID (firma JWKS, iss, aud, exp, nonce).
    "pyjwt[crypto]>=2.15.1,<3",
    "argon2-cffi==23.1.0",
    "sqlglot==26.1.0",
    "qdrant-client==1.12.2",
    "python-docx==1.1.2",
    "pypdf>=6.19.0,<7",
    "openpyxl==3.1.5",
    "python-multipart>=0.0.31,<0.1",
    "PyYAML==6.0.2",
    "jsonschema>=4.23,<5",
    "psutil>=7,<8",
    "starlette>=1.3.1,<2",
    # Minimo de seguridad para el transporte transitivo de Qdrant/requests.
    "urllib3>=2.8.0,<3",
]

[project.optional-dependencies]
# Suites de calidad y seguridad. Se instalan por separado para que un equipo
# de produccion no arrastre herramientas de auditoria.
vertex = ["google-auth>=2.40,<3", "requests>=2.32.4,<3"]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov==6.0.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "bandit==1.8.0",
    "pip-audit==2.7.3",
    "detect-secrets==1.5.0",
    "types-PyYAML==6.0.12.20240917",
]
# Drivers de bases de datos externas: opcionales porque no todos los entornos
# los necesitan, pero los adapters existen siempre.
oracle = ["oracledb==2.5.1"]
mssql = ["pymssql==2.3.2"]
postgres = ["psycopg[binary]==3.2.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*", "seeds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: pruebas unitarias puras",
    "integration: requieren MySQL/Qdrant/Ollama",
    "security: pruebas de seguridad automatizadas",
    "critical: gate critico que no admite fallos",
    "ollama: requieren modelos Ollama reales",
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# 120 columnas: las definiciones de columnas SQLAlchemy y las firmas de FastAPI
# se leen mejor en una linea que partidas. Es una convencion de formato, no una
# supresion de hallazgos: las reglas de seguridad (S) siguen activas.
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
# S101 (assert): pytest los usa por diseno.
# B008 (llamada en argumento por defecto): es el patron de Depends() de FastAPI.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# En las pruebas de seguridad los "secretos" son fixtures sinteticos deliberados.
"tests/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = []

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
