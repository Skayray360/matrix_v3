# Creado por Aldo Garcia.
# Catalogo de fuentes de datos estructuradas.
#
# IMPORTANTE: este archivo NO contiene DSN ni credenciales. `secret_ref` es el
# NOMBRE de la variable de entorno que contiene la cadena de conexion con una
# cuenta de SOLO LECTURA.
#
# `enabled: false` deja la fuente en estado DISABLED: el adapter
# existe, se valida su configuracion y hay pruebas de contrato, pero no se
# declara conectada. Ver docs/integrations/README.md.

version: 1

sources:
  # -------------------------------------------------------------------------
  # Fuente de demostracion sobre la propia base interna (MySQL/WAMP).
  # Se habilita con MATRIX_DEMO_DB_DSN para poder ejercitar el flujo completo
  # plan -> validacion -> SQL parametrizado -> ejecucion read-only.
  # -------------------------------------------------------------------------
  - name: rh_demo
    engine: mysql
    description: Fuente sintetica de demostracion de plantilla de RH.
    enabled: false
    row_scope: user
    secret_ref: MATRIX_DEMO_DB_DSN
    timeout_seconds: 15
    max_rows: 200
    allowed_roles:
      - matrix_admin_test
      - hcm_adm_ia_matrix
    entities:
      - name: plantilla
        table: demo_plantilla
        description: Plantilla sintetica por departamento y centro de trabajo.
        allowed_columns:
          - empleado_id
          - departamento
          - centro_trabajo
          - puesto
          - antiguedad_anios
          - estatus
        required_filters:
          estatus: activo
        # Solo filas cuyo identificador sintetico coincide con el username de
        # servidor. Las cuentas demo no obtienen acceso a toda la plantilla.
        required_user_filters:
          empleado_id: user.username
        max_rows: 200

  # -------------------------------------------------------------------------
  # Plantillas listas para conectar. Mantienen el adapter, la validacion de
  # configuracion y el health check aunque el motor no exista en este equipo.
  # -------------------------------------------------------------------------
  - name: sap_hcm
    engine: sqlserver
    description: Vista de seguridad de SAP HCM (pendiente de credenciales).
    enabled: false
    row_scope: user
    secret_ref: MATRIX_SAP_HCM_DSN
    timeout_seconds: 20
    max_rows: 200
    allowed_roles:
      - matrix_admin_test
      - hcm_adm_admpersonal
    entities:
      - name: empleado_resumen
        table: vw_matrixrh_empleado_resumen
        description: Vista de solo lectura con datos no sensibles del empleado.
        allowed_columns:
          - empleado_id
          - centro_trabajo
          - puesto
          - fecha_ingreso
        required_filters: {}
        # Pendiente de definir una columna de la vista que corresponda a un
        # atributo autentico user.user_id, user.username o user.email. Habilitar
        # la fuente con este mapa vacio seguira denegando catalogo/consultas.
        required_user_filters: {}
        max_rows: 200

  - name: oracle_hcm
    engine: oracle
    description: Vista de Oracle HCM (pendiente de credenciales).
    enabled: false
    row_scope: user
    secret_ref: MATRIX_ORACLE_HCM_DSN
    timeout_seconds: 20
    max_rows: 200
    allowed_roles:
      - matrix_admin_test
      - hcm_adm_admpersonal
    entities:
      - name: posiciones
        table: VW_MATRIXRH_POSICIONES
        description: Catalogo de posiciones vigentes.
        allowed_columns:
          - POSICION_ID
          - DESCRIPCION
          - DEPARTAMENTO
          - ESTATUS
        required_filters: {}
        required_user_filters: {}
        max_rows: 200

  - name: postgres_analytics
    engine: postgresql
    description: Data mart analitico de RH (pendiente de credenciales).
    enabled: false
    row_scope: user
    secret_ref: MATRIX_PG_ANALYTICS_DSN
    timeout_seconds: 20
    max_rows: 500
    allowed_roles:
      - matrix_admin_test
      - hcm_adm_ia_matrix
    entities:
      - name: rotacion_mensual
        table: vw_rotacion_mensual
        description: Indicadores agregados de rotacion por mes y area.
        allowed_columns:
          - periodo
          - area
          - altas
          - bajas
          - rotacion_pct
        required_filters: {}
        required_user_filters: {}
        max_rows: 500
