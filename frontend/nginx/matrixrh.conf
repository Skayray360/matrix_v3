# Creado por Aldo Garcia.
# Alternativa Docker local. TLS autofirmado: no equivale a un certificado confiable.
server {
    listen 8443 ssl;
    http2 on;
    server_name localhost 127.0.0.1;
    ssl_certificate     /etc/nginx/certs/matrixrh.crt;
    ssl_certificate_key /etc/nginx/certs/matrixrh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MatrixRH:10m;
    ssl_session_timeout 1h;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Limite del cuerpo coherente con UPLOAD_BODY_MAX_BYTES=30000000.
    client_max_body_size 30000000;
    client_body_timeout 120s;

    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Reemplaza la cabecera del cliente, no acepta su cadena de proxies.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_send_timeout 660s;
        proxy_read_timeout 660s;
        proxy_buffering off;
    }
}
